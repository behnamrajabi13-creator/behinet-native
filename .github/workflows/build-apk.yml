name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platforms;android-35 build-tools;35.0.0'
          accept-android-sdk-licenses: true
          
      - name: Install Dependencies
        run: npm install --legacy-peer-deps
        
      - name: Patch expo-autolinking bug
        run: |
          sed -i 's/const watchedDirectories = JSON.parse(watchedDirectoriesSerialized);/const watchedDirectories = []; \/\/ PATCHED/' node_modules/expo-modules-autolinking/build/commands/mirrorKotlinInlineModulesCommand.js
          sed -i 's/package="[^"]*"//g' node_modules/@react-native-masked-view/masked-view/android/src/main/AndroidManifest.xml
          
      - name: Generate Android Project
        run: npx expo prebuild --platform android --clean
        
      - name: Disable R8
        run: sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
        
      - name: Build APK
        run: |
          cd android
          echo "org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g" >> gradle.properties
          ./gradlew assembleRelease -PreactNativeArchitectures=arm64-v8a
          
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: behinet-apk
          path: android/app/build/outputs/apk/release/app-release.apk
